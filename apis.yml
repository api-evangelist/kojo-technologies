aid: kojo-technologies
name: Kojo Technologies
description: 'Kojo Technologies (formerly Agora Systems) builds construction materials
  management software for trade contractors — electrical, mechanical, plumbing, concrete
  and specialty trades. The Kojo platform centralizes procurement and purchasing, field
  requisitions from a mobile app, warehouse and inventory management, tool tracking,
  prefab workflows, project operations, and AI-assisted accounts payable invoice capture
  and matching. Kojo connects contractors to more than two hundred material suppliers
  and integrates with fifteen-plus construction accounting and project management systems
  including Procore, Autodesk, Sage, Acumatica, CMiC, Vista, Spectrum, FOUNDATION and
  QuickBooks. Kojo is backed by Battery Ventures. As of this profile Kojo publishes no
  public developer portal, API reference, or open API program — integration is delivered
  through its own supplier and ERP connectors rather than a self-serve developer API.'
